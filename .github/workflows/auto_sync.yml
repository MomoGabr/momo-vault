name: Daily Momo Vault Auto-Sync

on:
  schedule:
    # 3 esecuzioni giornaliere su righe separate (minuto :23) per massima affidabilità su GitHub Actions
    - cron: '23 7 * * *'
    - cron: '23 13 * * *'
    - cron: '23 19 * * *'
  workflow_dispatch: # Permette anche l'avvio manuale con 1 clic da GitHub

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Daily YouTube + RogerEbert + Scaruffi + Trakt Sync
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_ACCESS_TOKEN: ${{ secrets.TRAKT_ACCESS_TOKEN }}
        run: |
          python3 daily_sync.py
          rm -f cine_dashboard.html index.html

      - name: Commit and Push updated Vault & Dashboard
        run: |
          git config user.name "MomoGabr"
          git config user.email "MomoGabr@users.noreply.github.com"
          git add cine_db.json docs/index.html daily_updates.txt docs/daily_updates.txt
          git diff --staged --quiet || (git commit -m "chore(vault): daily auto-sync YouTube + Ebert + Scaruffi + Trakt" && git push)
